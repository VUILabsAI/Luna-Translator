name: Community checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            backend/go.sum
            examples/quickstart/go.sum
      - run: npm ci
      - run: npm run build --workspace web
      - run: npm exec --workspace web -- vitest run src/lib/consumerHistory.test.ts src/lib/multilingualShowcase.test.ts src/lib/backfillAudio.test.ts src/lib/welcomeI18n.test.ts src/lib/welcomeRouting.test.ts
      - run: go -C backend test -race ./...
      - run: go -C examples/quickstart test -race ./...
      - run: python3 scripts/check-public-content.py
      - run: node scripts/readme-badges.mjs --check
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait
      - run: curl --fail http://localhost:8088/health
      - if: always()
        run: docker compose down

  ios:
    name: Build iOS community client
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: >
          xcodebuild -project ios/LunaCommunity.xcodeproj -scheme LunaCommunity
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
